<body>

<style>
/* 레이아웃: 법랑 간판 느낌의 액자 히어로 + 고정 탭바 + 단일 컬럼 메뉴 리스트 */
:root{
  --paper:#FFFBF4;
  --card:#FFFFFF;
  --ink:#1F1710;
  --muted:#7A6A53;
  --brick:#ED7A1A;      /* 로고 주황꽃 계열: 채움과 테두리 */
  --on-brick:#1F1710;   /* 주황 위 글자 (6.23:1) */
  --deep:#A94E06;       /* 밝은 배경 위 주황 글자 (5.42:1) */
  --flame:#A94E06;
  --line:#EDDCC6;
  --chip:#FDEEDD;
  --shadow:0 1px 2px rgba(80,52,8,.06), 0 8px 24px rgba(80,52,8,.06);
  --f-disp:'Archivo Black','Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --f-ko:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#171009; --card:#221811; --ink:#F6EBDA; --muted:#A28F77;
    --brick:#F08422; --on-brick:#1F1710; --deep:#F79548; --flame:#F79548;
    --line:#3B2C1D; --chip:#2A1D12;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#171009; --card:#221811; --ink:#F6EBDA; --muted:#A28F77;
  --brick:#F08422; --on-brick:#1F1710; --deep:#F79548; --flame:#F79548;
  --line:#3B2C1D; --chip:#2A1D12;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px;border-radius:4px}

/* ---------- 히어로 액자 ---------- */
.hero{padding-block:18px 14px}
.plaque{
  position:relative;background:var(--card);border:2.5px solid var(--brick);
  border-radius:10px;padding:22px 20px 18px;text-align:center;box-shadow:var(--shadow);
}
.plaque::after{
  content:"";position:absolute;inset:4.5px;border:1.5px solid var(--brick);
  border-radius:6px;pointer-events:none;
}
.stud{position:absolute;width:17px;height:17px;border-radius:50%;background:var(--brick);display:grid;place-items:center;z-index:1}
.stud::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--card)}
.stud.tl{top:8px;left:8px}.stud.tr{top:8px;right:8px}
.stud.bl{bottom:8px;left:8px}.stud.br{bottom:8px;right:8px}
.brandwrap{margin:0;display:block;font-weight:inherit}
.logo{
  display:block;width:100%;max-width:400px;height:auto;
  margin:0 auto;
}
.brand{
  display:block;font-family:var(--f-disp);color:var(--deep);
  font-size:clamp(14px,4vw,19px);line-height:1.22;margin-top:9px;
  letter-spacing:-.005em;text-wrap:balance;
}
[lang="ko"] .brand{font-family:var(--f-ko);letter-spacing:0}
.tagline{margin:6px 0 0;color:var(--muted);font-size:13px;letter-spacing:.09em;text-transform:uppercase}

/* ---------- 언어 칩 ---------- */
.langs{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:16px}
.lang{
  font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;
  padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);
  background:transparent;color:var(--muted);transition:background .14s,color .14s,border-color .14s;
}
.lang[aria-pressed="true"]{background:var(--brick);border-color:var(--brick);color:var(--on-brick)}
@media (hover:hover){.lang:hover:not([aria-pressed="true"]){border-color:var(--brick);color:var(--brick)}}

/* ---------- 고정 바 ---------- */
.sticky{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:var(--paper);border-bottom:1.5px solid var(--line);
}
.bar{display:flex;align-items:center;gap:10px;padding-block:9px}
.tabs{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:3px;flex:1;min-width:0}
.tab{
  flex:1;min-width:0;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;
  padding:7px 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .14s,color .14s;
}
.tab[aria-selected="true"]{background:var(--brick);color:var(--on-brick)}
.iconbtn{
  flex:0 0 auto;font:inherit;font-size:13px;font-weight:700;cursor:pointer;
  padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);
  background:transparent;color:var(--ink);display:inline-flex;align-items:center;gap:6px;
}
@media (hover:hover){.iconbtn:hover{border-color:var(--brick);color:var(--brick)}}
.iconbtn svg{width:15px;height:15px;flex:0 0 auto}

/* ---------- 메뉴 본문 ---------- */
main{padding-block:4px 40px}
.sec{margin:26px 0 10px}
.sec:first-child{margin-top:16px}
.sec h2{
  margin:0;font-size:15px;font-weight:700;color:var(--flame);
  letter-spacing:.01em;line-height:1.35;text-wrap:balance;
}
.sec .rule{height:2px;background:var(--flame);opacity:.22;margin-top:7px;border-radius:2px}

.item{display:flex;align-items:baseline;gap:0;padding:8px 0}
.item .num{
  flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;
  color:var(--on-brick);background:var(--brick);border-radius:5px;
  min-width:22px;display:inline-flex;align-items:center;justify-content:center;
  padding:1px 5px 2px;margin-right:9px;align-self:baseline;
}
.item .nm{flex:0 1 auto;min-width:0;font-weight:500;line-height:1.38;font-size:15.5px}
.item .ldr{
  flex:1 1 0;min-width:10px;height:0;margin:0 7px;align-self:baseline;
  border-bottom:2px dotted var(--line);position:relative;top:.1em;
}
.item .pr{
  flex:0 0 auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:15.5px;
  white-space:nowrap;
}
.item .pr small{font-size:11.5px;font-weight:500;color:var(--muted);margin-left:2px}

.subs{display:flex;flex-wrap:wrap;gap:5px;margin:1px 0 7px 31px}
.subs span{
  font-size:12.5px;color:var(--muted);background:var(--chip);
  border-radius:6px;padding:3px 8px;line-height:1.3;
}
.note{
  margin:8px 0;padding:9px 12px;border-left:3px solid var(--line);
  background:var(--chip);border-radius:0 8px 8px 0;
  font-size:13.5px;line-height:1.45;color:var(--muted);
}
.note.hi{border-left-color:var(--flame);color:var(--deep);font-weight:500}

footer{
  padding-block:18px 34px;border-top:1.5px solid var(--line);margin-top:8px;
  color:var(--muted);font-size:13px;text-align:center;
}
footer p{margin:0 0 4px}
.social{display:flex;gap:14px;justify-content:center;margin:2px 0 18px}
.social a{
  display:grid;place-items:center;width:56px;height:56px;border-radius:50%;
  border:1.5px solid var(--line);background:#FFFFFF;text-decoration:none;
  box-shadow:0 1px 3px rgba(60,36,8,.10);
  transition:border-color .14s,transform .14s,box-shadow .14s;
}
@media (hover:hover){
  .social a:hover{border-color:var(--brick);transform:translateY(-2px);box-shadow:0 4px 10px rgba(60,36,8,.16)}
}
.social img{width:34px;height:34px;object-fit:contain;display:block}

/* ---------- 오버레이 ---------- */
.ovl{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(30,14,10,.55);padding:20px}
.sheet{
  background:var(--card);border:2px solid var(--brick);border-radius:14px;
  padding:22px 20px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow);
}
.sheet h3{margin:0 0 14px;font-size:16px;font-weight:700;color:var(--deep)}
.sheetbtns{display:flex;gap:8px;margin-top:14px}
.sheetbtns button{
  flex:1;font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:10px;
  border-radius:9px;border:1.5px solid var(--line);background:transparent;color:var(--ink);
}
.sheetbtns button.primary{background:var(--brick);border-color:var(--brick);color:var(--on-brick)}
.langgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langgrid button{
  font:inherit;font-size:15px;font-weight:700;cursor:pointer;padding:13px 8px;
  border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink);
}
.langgrid button[aria-pressed="true"]{background:var(--brick);border-color:var(--brick);color:var(--on-brick)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){
  .item .nm,.item .pr{font-size:14.5px}
  .langs{gap:6px}
}
</style>

const LINKS = [
  { url: 'https://map.naver.com/p/entry/place/1090486247?lng=127.0107997&lat=37.5724091'
       + '&placePath=%2Fhome%3Ffrom%3Dmap%26fromPanelNum%3D1%26additionalHeight%3D76'
       + '%26timestamp%3D202611091131%26locale%3Dko%26svcName%3Dmap_pcv5&searchType=place&c=15.00,0,0,0,dh',
    icon: ICON_NAVER,
    label: { ko:'네이버 지도', en:'Naver Map', zh:'NAVER 地图', ja:'NAVER マップ',
             vi:'Naver Map', fr:'Naver Map' } },
  { url: 'https://youtube.com/@ggoat100suk22',
    icon: ICON_YT,
    label: { ko:'유튜브', en:'YouTube', zh:'YouTube', ja:'YouTube', vi:'YouTube', fr:'YouTube' } },
  { url: 'https://www.instagram.com/ggoat100suk2022',
    icon: ICON_IG,
    label: { ko:'인스타그램', en:'Instagram', zh:'Instagram', ja:'Instagram',
             vi:'Instagram', fr:'Instagram' } }
];

function renderSocial(code){
  el('social').innerHTML = LINKS.map(function(l){
    const t = esc(l.label[code] || l.label.en);
    return '<a href="' + l.url + '" target="_blank" rel="noopener noreferrer"'
         + ' aria-label="' + t + '" title="' + t + '">'
         + '<img src="' + l.icon + '" alt="" width="34" height="34" loading="lazy"></a>';
  }).join('');
}

const el = id => document.getElementById(id);
let lang = 'ko', tab = 'meals';

function pickInitialLang(){
  const h = (location.hash || '').replace('#','').toLowerCase();
  if (DATA.some(d => d.code === h)) return h;
  try { const s = localStorage.getItem('menu-lang'); if (DATA.some(d => d.code === s)) return s; } catch(e){}
  const navs = (navigator.languages || [navigator.language || '']).map(s => (s||'').toLowerCase());
  for (const n of navs){
    if (n.startsWith('ko')) return 'ko';
    if (n.startsWith('ja')) return 'ja';
    if (n.startsWith('zh')) return 'zh';
    if (n.startsWith('vi')) return 'vi';
    if (n.startsWith('fr')) return 'fr';
    if (n.startsWith('en')) return 'en';
  }
  return 'ko';
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderRows(rows){
  let html = '', i = 0;
  while (i < rows.length){
    const r = rows[i];
    if (r.t === 'sec'){
      html += `<section class="sec"><h2>${esc(r.x)}</h2><div class="rule"></div></section>`;
      i++;
    } else if (r.t === 'item'){
      let name = r.x.replace(/^[-–]\s*/, '');
      let num = '';
      const m = name.match(/^(\d{1,2})\.\s*/);
      if (m){ num = m[1]; name = name.slice(m[0].length); }
      html += '<div class="item">'
        + (num ? `<span class="num">${esc(num)}</span>` : '')
        + `<span class="nm">${esc(name)}</span><span class="ldr"></span>`
        + `<span class="pr">${esc(r.p)}</span></div>`;
      i++;
      const subs = [];
      while (i < rows.length && rows[i].t === 'sub'){ subs.push(rows[i].x); i++; }
      if (subs.length) html += '<div class="subs">' + subs.map(s => `<span>${esc(s)}</span>`).join('') + '</div>';
    } else if (r.t === 'sub'){
      html += `<div class="subs"><span>${esc(r.x)}</span></div>`;
      i++;
    } else {
      html += `<div class="note${r.hi ? ' hi' : ''}">${esc(r.x)}</div>`;
      i++;
    }
  }
  return html;
}

function render(){
  const d = DATA.find(x => x.code === lang) || DATA[0];
  const menu = el('menu');
  menu.lang = d.code;
  menu.style.fontFamily = CJK[d.code] || '';
  el('brand').textContent = d.brand;
  el('brand').hidden = (d.code === 'ko');   // 로고가 이미 한글 상호
  el('brand').closest('.plaque').parentElement.lang = d.code;
  el('brandFoot').textContent = d.brand;
  el('unit').textContent = d.unit;
  el('langBtnLabel').textContent = d.name;
  el('langBtnLabel').lang = d.code;
  el('tab-meals').textContent = d.tabs[0];
  el('tab-drinks').textContent = d.tabs[1];
  el('tab-meals').setAttribute('aria-selected', tab === 'meals');
  el('tab-drinks').setAttribute('aria-selected', tab === 'drinks');
  el('langTitle').textContent = d.pick;
  menu.innerHTML = renderRows(tab === 'meals' ? d.meals : d.drinks);
  document.querySelectorAll('#langs .lang, #langGrid button').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.code === lang);
  });
  el('langClose').textContent = CLOSE[d.code] || CLOSE.en;
  renderSocial(d.code);
}

function setLang(code, remember){
  lang = code;
  if (remember){ try { localStorage.setItem('menu-lang', code); } catch(e){} }
  render();
}

// 언어 칩 + 시트 구성
DATA.forEach(d => {
  const chip = document.createElement('button');
  chip.className = 'lang'; chip.type = 'button'; chip.dataset.code = d.code;
  chip.textContent = d.name; chip.lang = d.code;
  chip.addEventListener('click', () => setLang(d.code, true));
  el('langs').appendChild(chip);

  const big = document.createElement('button');
  big.type = 'button'; big.dataset.code = d.code; big.textContent = d.name; big.lang = d.code;
  big.addEventListener('click', () => { setLang(d.code, true); el('langOvl').hidden = true; });
  el('langGrid').appendChild(big);
});

el('tab-meals').addEventListener('click', () => { tab = 'meals'; render(); });
el('tab-drinks').addEventListener('click', () => { tab = 'drinks'; render(); });
el('langClose').addEventListener('click', () => { el('langOvl').hidden = true; });
el('langBtn').addEventListener('click', () => { el('langOvl').hidden = false; });

el('langOvl').addEventListener('click', ev => {
  if (ev.target === el('langOvl')) el('langOvl').hidden = true;
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') el('langOvl').hidden = true;
});
addEventListener('hashchange', () => {
  const h = (location.hash || '').replace('#','').toLowerCase();
  if (DATA.some(d => d.code === h)) setLang(h, false);
});

setLang(pickInitialLang(), false);
</script>
